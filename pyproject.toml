[project]
name = "tinyecs-compsys"
description = "Compsys namespace package for tinyecs"
version = "0.0.3"
readme = "README.rst"

authors = [
    { name="Michael Lamertz", email="michael.lamertz@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
]

license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    'aenum',
    'tinyecs >= 0.5.0',
]

[project.urls]
homepage = "https://github.com/dickerdackel/tinyecs-compsys"
bugtracker = "https://github.com/dickerdackel/tinyecs-compsys/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
