[project]
name = "tinyecs-compsys"
description = "compsys root for tinyecs"
version = "0.0.1"
readme = "README.rst"

authors = [
    { name="Michael Lamertz", email="michael.lamertz@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
]

license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    'tinyecs'
]

[project.optional-dependencies]
base = ["tinyecs.compsys.base @ git+https://forgejo.indieandmore.photography/dickerdackel/tinyecs-compsys-base"]
dynamics = ["tinyecs.compsys.dynamics @ git+https://forgejo.indieandmore.photography/dickerdackel/tinyecs-compsys-dynamics"]
patternengine = ["tinyecs.compsys.patternengine @ git+https://forgejo.indieandmore.photography/dickerdackel/tinyecs-compsys-patternengine"]
sdl2 = ["tinyecs.compsys.sdl2 @ git+https://forgejo.indieandmore.photography/dickerdackel/tinyecs-compsys-sdl2"]
all = ["tinyecs.compsys[base,dynamics,sdl2,patternengine]"]

[dependency-groups]
docs = [
    "build",
    "setuptools",
    "sphinx",
    "sphinx-autobuild",
    "furo",
]

[project.urls]
homepage = "https://forgejo.indieandmore.photography/dickerdackel/tinyecs-compsys"
bugtracker = "https://forgejo.indieandmore.photography/dickerdackel/tinyecs-compsys/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
